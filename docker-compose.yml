version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: positivus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: positivus
      POSTGRES_PASSWORD: positivus_secret
      POSTGRES_DB: positivus_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U positivus']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: positivus_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://positivus:positivus_secret@db:5432/positivus_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      PORT: 4000
      NODE_ENV: production
    ports:
      - '4000:4000'

volumes:
  pgdata:
